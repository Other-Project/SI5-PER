[project]
name = "ros"
version = "0.1.0"
description = "ROS packages"
requires-python = ">=3.12"
dependencies = [
    "catkin-pkg>=1.1.0",
    "cflib>=0.1.29",
    "nicegui<2",
    "numpy>=2.3.5",
    "onnxruntime>=1.23.2",
    "pyyaml>=6.0",
    "rowan>=1.3.2",
    "transforms3d>=0.4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
